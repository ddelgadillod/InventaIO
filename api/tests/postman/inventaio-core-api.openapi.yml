            solo puede pedir la suya, y sin el parámetro se le aplica.
          title: Sucursal
        description: PRINCIPAL, LA 21, GLORIETA o BODEGA_CENTRAL; sin distinguir mayúsculas ni acentos. Un admin_sucursal
