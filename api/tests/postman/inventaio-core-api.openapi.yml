  /api/ml/predict:
    post:
      tags:
      - Pronóstico
      summary: Pronóstico de demanda a 15 días hábiles
      description: 'Pronostica la demanda acumulada de un producto en una sucursal física (POST /api/predict de ml_service,
        mismo contrato). Producto por producto_id o id_producto; sucursal por sucursal_id (nombre) o id_sucursal. RBAC: admin_sucursal
        solo su sucursal (403). Errores de la petición de ml_service pasan tal cual: 404 producto o sucursal desconocidos
        o historia insuficiente; 422 horizonte distinto de 15, sucursal no física (la Bodega) o cuerpo inválido. 503 ml_service
        o la bodega no disponibles; 504 sin respuesta en 120 s; 502 otro error.'
      operationId: predecir_api_ml_predict_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrediccionRequest'
            example:
              producto_id: P1632
              sucursal_id: PRINCIPAL
              horizonte: 15
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrediccionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
