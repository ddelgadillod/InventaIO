openapi: 3.1.0
info:
  title: InventAI/o API
  description: API del sistema inteligente de consulta y gestión logística para distribuidores de abarrotes.
  version: 1.0.0
servers:
- url: http://localhost:8000
  description: Docker Compose local
paths:
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Iniciar sesión
      description: Autentica con email y contraseña. Retorna access_token + refresh_token.
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/refresh:
    post:
      tags:
      - Auth
      summary: Renovar tokens
      description: Recibe un refresh_token válido y retorna nuevos access_token + refresh_token.
      operationId: refresh_api_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: <refresh_token del login>
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/logout:
    post:
      tags:
      - Auth
      summary: Cerrar sesión
      description: Invalida el refresh_token actual para impedir renovación.
      operationId: logout_api_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/auth/me:
    get:
      tags:
      - Auth
      summary: Perfil del usuario autenticado
      description: Retorna los datos del usuario autenticado, incluyendo nombre de sucursal.
      operationId: me_api_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
      security:
      - HTTPBearer: []
  /api/auth/password:
    patch:
      tags:
      - Auth
      summary: Cambiar contraseña
      description: Cambia la contraseña del usuario autenticado. Requiere la contraseña actual.
      operationId: change_password_api_auth_password_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/consulta/productos:
    get:
      tags:
      - Consulta
      summary: Listar productos
      description: Retorna productos paginados con filtros opcionales por categoría, familia, perecedero y búsqueda por nombre,
        familia o código (INV-26, V11).
      operationId: listar_productos_api_consulta_productos_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Página
          default: 1
          title: Page
        description: Página
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items por página
          default: 20
          title: Page Size
        description: Items por página
      - name: categoria
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtrar por categoría
          title: Categoria
        description: Filtrar por categoría
        example: Huevos
      - name: familia
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtrar por familia
          title: Familia
        description: Filtrar por familia
        example: Huevos
      - name: perecedero
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filtrar por perecedero
          title: Perecedero
        description: Filtrar por perecedero
      - name: busqueda
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Buscar en nombre, familia o código (codigo_item, por ejemplo P1632)
          title: Busqueda
        description: Buscar en nombre, familia o código (codigo_item, por ejemplo P1632)
        example: ARROZ
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/consulta/productos/{id_producto}:
    get:
      tags:
      - Consulta
      summary: Detalle de producto
      description: Retorna un producto por ID, incluyendo los proveedores que lo abastecen (dw.producto_proveedor).
      operationId: detalle_producto_api_consulta_productos__id_producto__get
      security:
      - HTTPBearer: []
      parameters:
      - name: id_producto
        in: path
        required: true
        schema:
          type: integer
          title: Id Producto
        example: 171
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoDetalle'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/consulta/productos/{id_producto}/ventas:
    get:
      tags:
      - Consulta
      summary: Ventas de un producto en ventanas de 15 días hábiles
      description: 'INV-26: ventas de un producto en una sucursal física, en ventanas de 15 días hábiles (días con alguna
        venta en la red, como el modelo) que terminan en el último día hábil, para compararlas con POST /api/ml/predict. Fuente:
        dw.v_ventas_diarias_netas (sin devoluciones). Un día sin venta cuenta 0. Permisos de INV-25: gerente y admin_bodega
        deben enviar sucursal_id; admin_sucursal, la suya. Errores: 403 otra sucursal o la Bodega (admin_sucursal); 404 producto
        inexistente; 422 sin sucursal_id, sucursal inexistente, SIN_SUCURSAL, la Bodega Central (no vende) o ventanas fuera
        de 1-24.'
      operationId: ventas_producto_api_consulta_productos__id_producto__ventas_get
      security:
      - HTTPBearer: []
      parameters:
      - name: id_producto
        in: path
        required: true
        schema:
          type: integer
          title: Id Producto
        example: 171
      - name: sucursal_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Sucursal física. Obligatoria para gerente y admin_bodega; admin_sucursal usa la suya.
          title: Sucursal Id
        description: Sucursal física. Obligatoria para gerente y admin_bodega; admin_sucursal usa la suya.
        example: 1
      - name: ventanas
        in: query
        required: false
        schema:
          type: integer
          maximum: 24
          minimum: 1
          description: Número de ventanas, de la más reciente hacia atrás
          default: 8
          title: Ventanas
        description: Número de ventanas, de la más reciente hacia atrás
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VentasProducto'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/consulta/sucursales:
    get:
      tags:
      - Consulta
      summary: Listar sucursales
      description: 'Retorna las ubicaciones con su información geográfica y tipo (principal, estandar o bodega_central). SIN_SUCURSAL
        no se lista: no tiene inventario y no se puede filtrar por ella.'
      operationId: listar_sucursales_api_consulta_sucursales_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucursalList'
      security:
      - HTTPBearer: []
  /api/consulta/proveedores:
    get:
      tags:
      - Consulta
      summary: Listar proveedores
      description: Retorna todos los proveedores con lead times y calificación.
      operationId: listar_proveedores_api_consulta_proveedores_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProveedorList'
      security:
      - HTTPBearer: []
  /api/consulta/proveedores/{id_proveedor}:
    get:
      tags:
      - Consulta
      summary: Detalle de proveedor
      description: Retorna un proveedor por ID, incluyendo los productos que abastece (dw.producto_proveedor).
      operationId: detalle_proveedor_api_consulta_proveedores__id_proveedor__get
      security:
      - HTTPBearer: []
      parameters:
      - name: id_proveedor
        in: path
        required: true
        schema:
          type: integer
          title: Id Proveedor
        example: 1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProveedorDetalle'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/consulta/categorias:
    get:
      tags:
      - Consulta
      summary: Listar categorías
      description: Retorna categorías con conteo de productos y distribución perecedero/no perecedero.
      operationId: listar_categorias_api_consulta_categorias_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaList'
      security:
      - HTTPBearer: []
  /api/consulta/inventario:
    get:
      tags:
      - Inventario
      summary: Stock actual con semáforo
      description: 'Retorna el inventario más reciente por producto-sucursal con semáforo (inconsistencia: stock negativo;
        si no, ok >7d, bajo 3-7d, critico <3d). Filtros: categoría, semáforo, búsqueda, sucursal. Cada fila trae tipo_ubicacion,
        stock_bodega (stock de la Bodega Central del mismo producto) y unidad (''kg'' si se vende por kilo; si no, ''unidad'').
        RBAC: admin_sucursal ve su sucursal y, con sucursal_id, el stock de la Bodega Central.'
      operationId: listar_inventario_api_consulta_inventario_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      - name: categoria
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtrar por categoría
          title: Categoria
        description: Filtrar por categoría
        example: Huevos
      - name: semaforo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filtrar: ok, bajo, critico, inconsistencia'
          title: Semaforo
        description: 'Filtrar: ok, bajo, critico, inconsistencia'
        example: critico
      - name: sucursal_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: 'Filtrar por sucursal. admin_sucursal: la suya o la Bodega Central; otra da 403. Un id inexistente
            o SIN_SUCURSAL da 422.'
          title: Sucursal Id
        description: 'Filtrar por sucursal. admin_sucursal: la suya o la Bodega Central; otra da 403. Un id inexistente o
          SIN_SUCURSAL da 422.'
        example: 1
      - name: busqueda
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Buscar en nombre producto
          title: Busqueda
        description: Buscar en nombre producto
        example: ARROZ
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventarioList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/consulta/inventario/detalle:
    get:
      tags:
      - Inventario
      summary: Historial 30 días de un producto
      description: 'Retorna el inventario actual y los últimos 30 días de un producto en una sucursal, con tipo_ubicacion
        y stock_bodega. Con la bodega real hay una sola foto: el historial trae un punto. RBAC: admin_sucursal, su sucursal
        o la Bodega Central.'
      operationId: detalle_inventario_api_consulta_inventario_detalle_get
      security:
      - HTTPBearer: []
      parameters:
      - name: id_producto
        in: query
        required: true
        schema:
          type: integer
          description: ID del producto
          title: Id Producto
        description: ID del producto
        example: 171
      - name: id_sucursal
        in: query
        required: true
        schema:
          type: integer
          description: ID de la sucursal
          title: Id Sucursal
        description: ID de la sucursal
        example: 1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventarioDetalle'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/consulta/inventario/resumen:
    get:
      tags:
      - Inventario
      summary: Contadores por semáforo
      description: Retorna la cantidad de productos en cada estado del semáforo (ok, bajo, critico e inconsistencia), por
        sucursal y global. Con sucursal_id, solo esa ubicación.
      operationId: resumen_inventario_api_consulta_inventario_resumen_get
      security:
      - HTTPBearer: []
      parameters:
      - name: sucursal_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: 'Filtrar por sucursal. admin_sucursal: la suya o la Bodega Central; otra da 403. Un id inexistente
            o SIN_SUCURSAL da 422.'
          title: Sucursal Id
        description: 'Filtrar por sucursal. admin_sucursal: la suya o la Bodega Central; otra da 403. Un id inexistente o
          SIN_SUCURSAL da 422.'
        example: 1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventarioResumenList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/consulta/inventario/valorizado:
    get:
      tags:
      - Inventario
      summary: Valor del stock por sucursal y categoría
      description: Retorna el valor monetario del inventario actual agrupado por sucursal y categoría. Con sucursal_id, solo
        esa ubicación.
      operationId: inventario_valorizado_api_consulta_inventario_valorizado_get
      security:
      - HTTPBearer: []
      parameters:
      - name: sucursal_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: 'Filtrar por sucursal. admin_sucursal: la suya o la Bodega Central; otra da 403. Un id inexistente
            o SIN_SUCURSAL da 422.'
          title: Sucursal Id
        description: 'Filtrar por sucursal. admin_sucursal: la suya o la Bodega Central; otra da 403. Un id inexistente o
          SIN_SUCURSAL da 422.'
        example: 1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValorizadoList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/alertas:
    get:
      tags:
      - Alertas
      summary: Alertas activas por urgencia
      description: 'Genera alertas dinámicas basadas en reglas de inventario. Tipos: inconsistencia_inventario (stock negativo),
        stock_critico, stock_bajo, sin_movimiento, rotacion_baja; la Bodega Central no tiene sin_movimiento ni rotacion_baja
        porque no vende. Urgencia: critica, alta, media. RBAC: admin_sucursal ve solo las de su sucursal. Con page o page_size
        devuelve solo esa página (más page, page_size y pages); sin ellos, todas.'
      operationId: listar_alertas_api_alertas_get
      security:
      - HTTPBearer: []
      parameters:
      - name: tipo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filtrar: inconsistencia_inventario, stock_critico, stock_bajo, sin_movimiento, rotacion_baja'
          title: Tipo
        description: 'Filtrar: inconsistencia_inventario, stock_critico, stock_bajo, sin_movimiento, rotacion_baja'
        example: inconsistencia_inventario
      - name: urgencia
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filtrar: critica, alta, media'
          title: Urgencia
        description: 'Filtrar: critica, alta, media'
        example: alta
      - name: sucursal_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: 'Filtrar por sucursal. admin_sucursal: solo la suya; otra da 403. Inexistente o SIN_SUCURSAL, 422'
          title: Sucursal Id
        description: 'Filtrar por sucursal. admin_sucursal: solo la suya; otra da 403. Inexistente o SIN_SUCURSAL, 422'
        example: 1
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: 'Página (INV-26 fix). Sin page ni page_size: todas'
          title: Page
        description: 'Página (INV-26 fix). Sin page ni page_size: todas'
      - name: page_size
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 500
            minimum: 1
          - type: 'null'
          description: Alertas por página; 50 si solo se envía page
          title: Page Size
        description: Alertas por página; 50 si solo se envía page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertaList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/alertas/resumen:
    get:
      tags:
      - Alertas
      summary: Contadores de alertas
      description: Retorna contadores de alertas por urgencia, por sucursal, y por tipo. Con sucursal_id, solo esa ubicación.
      operationId: resumen_alertas_api_alertas_resumen_get
      security:
      - HTTPBearer: []
      parameters:
      - name: sucursal_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: 'Filtrar por sucursal. admin_sucursal: solo la suya; otra da 403. Inexistente o SIN_SUCURSAL, 422'
          title: Sucursal Id
        description: 'Filtrar por sucursal. admin_sucursal: solo la suya; otra da 403. Inexistente o SIN_SUCURSAL, 422'
        example: 1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertaResumen'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/reportes/kpis:
    get:
      tags:
      - Reportes
      summary: KPIs principales
      description: ventas_hoy, ventas_mes, productos_en_riesgo (semáforo bajo + crítico; el stock negativo cuenta como inconsistencia,
        no en riesgo), stock_valorizado.
      operationId: kpis_api_reportes_kpis_get
      security:
      - HTTPBearer: []
      parameters:
      - name: sucursal_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: 'Filtrar por sucursal. admin_sucursal: solo la suya; otra da 403. Inexistente o SIN_SUCURSAL, 422'
          title: Sucursal Id
        description: 'Filtrar por sucursal. admin_sucursal: solo la suya; otra da 403. Inexistente o SIN_SUCURSAL, 422'
        example: 1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPIs'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/reportes/ventas:
    get:
      tags:
      - Reportes
      summary: Ventas con filtros y agrupación
      description: 'Filtros: fecha_inicio, fecha_fin, sucursal, categoría. Agrupación: dia, semana, mes. datos_desde y datos_hasta:
        la primera y la última fecha con ventas.'
      operationId: ventas_api_reportes_ventas_get
      security:
      - HTTPBearer: []
      parameters:
      - name: fecha_inicio
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: YYYY-MM-DD
          title: Fecha Inicio
        description: YYYY-MM-DD
        example: '2025-12-01'
      - name: fecha_fin
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: YYYY-MM-DD
          title: Fecha Fin
        description: YYYY-MM-DD
        example: '2025-12-31'
      - name: sucursal_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: 'Filtrar por sucursal. admin_sucursal: solo la suya; otra da 403. Inexistente o SIN_SUCURSAL, 422'
          title: Sucursal Id
        description: 'Filtrar por sucursal. admin_sucursal: solo la suya; otra da 403. Inexistente o SIN_SUCURSAL, 422'
        example: 1
      - name: categoria
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Categoria
        example: Huevos
      - name: agrupacion
        in: query
        required: false
        schema:
          type: string
          description: dia, semana, mes
          default: dia
          title: Agrupacion
