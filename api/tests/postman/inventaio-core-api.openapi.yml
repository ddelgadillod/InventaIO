  /api/ml/recomendaciones/compras:
    get:
      tags:
      - Recomendaciones
      summary: Compras a proveedor sugeridas (INV-21), con filtros
      description: 'Recomendación de compras de ml_service (POST /api/compras) para todo el catálogo, con nombre y categoría
        del producto. Con una sucursal física devuelve sus compras directas y las de la Bodega donde participa, vistas desde
        ella: su urgencia, su detalle y su parte de la necesidad (necesidad_sucursal). El resumen se recalcula sobre lo filtrado.
        La primera llamada tras una foto nueva tarda unos 20 s; las siguientes salen de la caché. Errores: 401 token inválido;
        403 sin token o sucursal ajena; 409 foto posterior a la última venta; 422 parámetro inválido o desconocido; 502 error
        inesperado de ml_service; 503 ml_service o la bodega no disponibles; 504 ml_service no respondió a tiempo.'
      operationId: recomendaciones_compras_api_ml_recomendaciones_compras_get
      security:
      - HTTPBearer: []
      parameters:
      - name: sucursal
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: PRINCIPAL, LA 21, GLORIETA o BODEGA_CENTRAL; sin distinguir mayúsculas ni acentos. Un admin_sucursal
            solo puede pedir la suya, y sin el parámetro se le aplica.
          title: Sucursal
        description: PRINCIPAL, LA 21, GLORIETA o BODEGA_CENTRAL; sin distinguir mayúsculas ni acentos. Un admin_sucursal
          solo puede pedir la suya, y sin el parámetro se le aplica.
        example: PRINCIPAL
      - name: categoria
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Una categoría de dw.dim_producto (p. ej. Lácteos o lacteos); sin distinguir mayúsculas ni acentos.
          title: Categoria
        description: Una categoría de dw.dim_producto (p. ej. Lácteos o lacteos); sin distinguir mayúsculas ni acentos.
        example: Huevos
      - name: urgencia
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - urgente
            - alta
            - normal
            type: string
          - type: 'null'
          description: Coincidencia exacta. No filtra las alertas.
          title: Urgencia
        description: Coincidencia exacta. No filtra las alertas.
        example: alta
      - name: incluir_detalle
        in: query
        required: false
        schema:
          type: boolean
          description: Con false, las filas no traen el cálculo por sucursal.
          default: true
          title: Incluir Detalle
        description: Con false, las filas no traen el cálculo por sucursal.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecomendacionesCompras'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
