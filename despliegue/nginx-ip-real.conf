# InventAI/o — La IP y el esquema reales del cliente detrás de Caddy (INV-34, B15). docker-compose.prod.yml
# la monta en /etc/nginx/snippets/ip-real.conf y frontend/nginx.conf la incluye dentro del server.
#
# Sin esto, todas las peticiones llegarían con la IP de Caddy y el límite de logins fallidos por IP (INV-66)
# sería uno solo para todos los clientes. Nginx cree en X-Forwarded-For solo si la petición viene de la
# subred fija de docker-compose.prod.yml: web no publica puertos, así que solo Caddy le habla desde ahí.
set_real_ip_from 172.30.0.0/24;
real_ip_header X-Forwarded-For;

# Caddy termina el TLS y le habla a web por HTTP: el esquema que vio el cliente llega en X-Forwarded-Proto
set $esquema_cliente $http_x_forwarded_proto;
