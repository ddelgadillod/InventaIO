[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
markers =
    llm: necesita Ollama con el modelo de LLM_MODELO; se salta si no está. Solo en local, nunca en el CI
    bedrock: necesita credenciales de AWS que puedan invocar el modelo en Bedrock (INV-67); se salta sin ellas. Solo en local, nunca en el CI
    mlflow: necesita mlflow instalado (requirements-evaluacion.txt); se salta si no está, como en el CI
