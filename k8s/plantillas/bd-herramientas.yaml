# Pod de herramientas de la base (psql, pg_dump y pg_restore de Postgres 16): lo crea scripts/bd/comun.sh cuando
# BD_POD está definida y lo borra al terminar. Trae la conexión del ambiente en su entorno, así que la clave no pasa
# por la línea de comandos. Los archivos de volcado van y vuelven por /volcado con kubectl cp. Se apaga solo en una hora.
apiVersion: v1
kind: Pod
metadata:
  name: bd-herramientas
  namespace: inventaio
  labels:
    app.kubernetes.io/name: bd-herramientas
    app.kubernetes.io/part-of: inventaio
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 3600
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: herramientas
      image: postgres:16-alpine
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
      workingDir: /volcado
      env:
        - name: PGHOST
          valueFrom:
            configMapKeyRef:
              name: inventaio-bd
              key: POSTGRES_HOST
        - name: PGPORT
          valueFrom:
            configMapKeyRef:
              name: inventaio-bd
              key: POSTGRES_PORT
        - name: PGDATABASE
          valueFrom:
            configMapKeyRef:
              name: inventaio-bd
              key: POSTGRES_DB
        - name: PGUSER
          valueFrom:
            configMapKeyRef:
              name: inventaio-bd
              key: POSTGRES_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: inventaio-secretos
              key: POSTGRES_PASSWORD
        # Sin los NOTICE de «already exists, skipping» de cada pasada
        - name: PGOPTIONS
          value: "-c client_min_messages=warning"
        # RDS exige SSL; el contenedor de staging lo acepta sin él
        - name: PGSSLMODE
          value: prefer
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: volcado
          mountPath: /volcado
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: volcado
      emptyDir:
        sizeLimit: 2Gi
    - name: tmp
      emptyDir:
        sizeLimit: 64Mi
