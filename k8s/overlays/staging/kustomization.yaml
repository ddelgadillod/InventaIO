# Staging en k3s: la base, más PostgreSQL dentro del clúster. scripts/desplegar.sh fija los tags de las imágenes y
# el nombre del origen (DOMINIO, desde Parameter Store), y crea el Secret y el esquema.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# También aquí: el namespace de la base no alcanza lo que agrega esta variante (Postgres o el Service de RDS)
namespace: inventaio

resources:
  - ../../base

components:
  - ../../componentes/postgres

configMapGenerator:
  - name: inventaio-config
    behavior: merge
    literals:
      - ENTORNO=staging
      - DOMINIO=inventaio-staging.duckdns.org
