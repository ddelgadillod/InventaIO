# InventAI/o — La IP y el esquema del cliente detrás de Caddy, dentro del clúster (despliegue/nginx-ip-real.conf es el
# de compose). Caddy pone en X-Forwarded-For la IP del visitante que le da CloudFront (k8s/base/Caddyfile). Se confía
# solo en la red de pods de k3s (10.42.0.0/16): una cabecera que llegue de otro lado no cambia $remote_addr.
# Sin esto, el límite de login por IP (INV-66) vería a todos con la IP de Caddy.
set_real_ip_from 10.42.0.0/16;
real_ip_header X-Forwarded-For;
set $esquema_cliente $http_x_forwarded_proto;
