# InventAI/o — Reemplaza a frontend/nginx/upstream.conf dentro del clúster. Nginx no usa los dominios de búsqueda de
# Kubernetes: necesita la IP del DNS del clúster (10.43.0.10 es la de k3s y k3d) y el nombre completo del servicio.
# En EKS el DNS es otro: se cambia en la variante.
resolver 10.43.0.10 valid=10s ipv6=off;
set $core_api http://api.inventaio.svc.cluster.local:8000;
