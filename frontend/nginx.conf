# InventAI/o — Nginx del frontend: sirve el build de Vite y pasa /api al Core API.
# Es la base de INV-34 (SSL, dominio, AWS) e INV-36 (/api/chat/ y WebSocket).
#
# Tiempos de espera: las recomendaciones (INV-27) tardan entre 20 y 40 s en frío
# y el Core API espera a ml_service hasta 120 s (ML_SERVICE_TIMEOUT_SEGUNDOS). El
# cliente corta a los 130 s (TIMEOUT_ML_MS en src/api/client.js). Nginx espera
# más que los dos, 135 s: así decide el cliente y un 504 del Core API llega tal
# cual. Sin esto, Nginx corta a los 60 s (el proxy_read_timeout por defecto).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Las compras de toda la red pesan 737 KB en JSON: comprimidas, 70 KB
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # El DNS de Docker se consulta en cada petición: si el contenedor del Core API
    # se reinicia y cambia de IP, Nginx no se queda con la vieja (daría 502)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core_api http://api:8000;

    location /api/ {
        proxy_pass $core_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 135s;
        proxy_read_timeout 135s;
    }

    # Los archivos de assets/ llevan un hash en el nombre: se pueden guardar un año
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React Router: cualquier otra ruta (/recomendaciones, /predicciones…) es la app
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
