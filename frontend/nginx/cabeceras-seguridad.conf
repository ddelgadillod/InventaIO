# InventAI/o — Cabeceras de seguridad (INV-66, CA 7 y H9 de docs/INV-66-requerimientos.md).
# Se incluye a nivel de server en nginx.conf, e INV-34 la reutiliza en el servidor con TLS.
# `always` las manda también en las respuestas de error. Ojo: un add_header dentro de
# una location anula estas, salvo que esa location declare `add_header_inherit merge`
# (Nginx >= 1.29.3; la imagen trae la 1.30).

add_header X-Content-Type-Options "nosniff" always;
# Nadie puede meter la aplicación en un iframe (clickjacking): frame-ancestors de la CSP para
# los navegadores actuales y X-Frame-Options para los viejos
add_header X-Frame-Options "DENY" always;
# INV-68 (U4): todo sale del mismo origen, también las fuentes (@fontsource). La única excepción
# son las imágenes data: (el fondo del login). Los estilos de la prop `style` de React pasan
# porque se asignan por el DOM, no como atributo en el HTML. Una sola cabecera: con dos, el
# navegador aplica las dos
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Los navegadores la ignoran sobre HTTP: rige cuando INV-34 active TLS. Sin includeSubDomains,
# para no comprometer otros subdominios del dominio que se elija
add_header Strict-Transport-Security "max-age=31536000" always;
