# InventAI/o — Cabeceras de seguridad (INV-66, CA 7 y H9 de docs/INV-66-requerimientos.md).
# Se incluye a nivel de server en nginx.conf, e INV-34 la reutiliza en el servidor con TLS.
# `always` las manda también en las respuestas de error. Ojo: un add_header dentro de
# una location anula estas, salvo que esa location declare `add_header_inherit merge`
# (Nginx >= 1.29.3; la imagen trae la 1.30).

add_header X-Content-Type-Options "nosniff" always;
# Nadie puede meter la aplicación en un iframe (clickjacking): la CSP para los navegadores
# actuales y X-Frame-Options para los viejos. Una CSP completa espera a INV-68, que lleva
# las fuentes al servidor (hoy index.html carga Google Fonts)
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Los navegadores la ignoran sobre HTTP: rige cuando INV-34 active TLS. Sin includeSubDomains,
# para no comprometer otros subdominios del dominio que se elija
add_header Strict-Transport-Security "max-age=31536000" always;
