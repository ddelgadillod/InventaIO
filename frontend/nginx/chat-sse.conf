# InventAI/o — Chat en streaming (INV-36, X8): /api/chat/ hacia el Core API, que
# valida el token y reenvía los eventos del agente interno (nunca al 8002, N3).
# Se incluye dentro del server de nginx.conf, antes de /api/, y INV-34 lo
# reutiliza en el servidor con TLS. Lo prueba scripts/probar_nginx_streaming.sh.
#
# Lo que de verdad acumula el flujo es comprimirlo (C3, medido el 15-oct: con
# text/event-stream en gzip_types el primer evento llega a los 5 s): aquí va
# gzip off aunque alguien lo agregue a gzip_types. El buffer va apagado para que
# cada evento salga apenas llega.
location /api/chat/ {
    proxy_pass $core_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # X9: el request_id nace aquí y pisa el que mande el navegador
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 135s;
    # Entre lecturas, no en total: el Core API corta a los 120 s y el agente
    # manda «: ping» cada 15 s, así que un flujo vivo nunca calla tanto
    proxy_read_timeout 135s;
}
