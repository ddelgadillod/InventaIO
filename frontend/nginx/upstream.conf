# InventAI/o — Dónde está el Core API y qué DNS lo resuelve. Valores para Docker Compose (desarrollo, verificación y
# staging en compose): el DNS interno de Docker y el nombre corto del servicio.
#
# En Kubernetes (k8s/base/nginx/upstream.conf) se reemplaza este archivo: Nginx no usa los dominios de búsqueda del
# clúster, así que allá va el DNS del clúster y el nombre completo del servicio.
#
# El DNS se consulta en cada petición (valid=10s): si el Core API se reinicia y cambia de IP, Nginx no se queda con la
# vieja (daría 502).
resolver 127.0.0.11 valid=10s ipv6=off;
set $core_api http://api:8000;
