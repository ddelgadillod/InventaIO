# InventAI/o — Dependabot (INV-24, D14): PR semanales y agrupados hacia develop,
# los lunes a las 6:00 en Bogotá. Las acciones van fijadas por SHA: Dependabot
# actualiza el SHA y el comentario de la versión.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    target-branch: develop
    commit-message:
      prefix: ci
    groups:
      acciones:
        patterns: ["*"]

  # requirements-dev.txt en la raíz y los requirements.txt de cada servicio, que
  # fijan todas las versiones (pip freeze). Al aceptar un PR se corren las suites
  # completas en local, como en la actualización de INV-24 (docs/CI-CD.md)
  - package-ecosystem: pip
    directories: ["/", "/api", "/ml_service", "/etl_real", "/nlp_agent"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    target-branch: develop
    commit-message:
      prefix: build
    # INV-76: etl/ es el ETL simulado antiguo; no corre en el CI y queda congelado como referencia
    exclude-paths: ["etl/**"]
    ignore:
      # Exigen Python 3.12 (numpy 2.5 y scipy 1.18), y las imágenes y el CI usan 3.11
      - dependency-name: numpy
        versions: [">=2.5"]
      - dependency-name: scipy
        versions: [">=1.18"]
      # La 5 rompe passlib 1.7.4 al generar el hash (ValueError con más de 72 bytes en su autodiagnóstico).
      # Se libera cuando el Core API deje passlib (INV-41)
      - dependency-name: bcrypt
        versions: [">=5"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    target-branch: develop
    commit-message:
      prefix: build
    # INV-76 (10-nov): React 19, react-router 8, recharts 3 y lucide-react 1 se migran después del 20-nov, con
    # su propia regresión. Con React 19, `inert=""` deja de aplicarse (App.jsx) y el fondo de Vera recibe el foco
    ignore:
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: react-router
        update-types: ["version-update:semver-major"]
      - dependency-name: recharts
        update-types: ["version-update:semver-major"]
      - dependency-name: lucide-react
        update-types: ["version-update:semver-major"]
    groups:
      produccion:
        dependency-type: production
      desarrollo:
        dependency-type: development

  - package-ecosystem: docker
    directories: ["/api", "/ml_service", "/nlp_agent", "/frontend"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    target-branch: develop
    commit-message:
      prefix: build
    groups:
      imagenes:
        patterns: ["*"]
    ignore:
      # Python 3.11 es el de las imágenes y el CI: subirlo es un cambio deliberado
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Node 22 es el de .nvmrc y el CI
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # nginx: las versiones impares (1.31, 1.33…) son mainline; la estable cambia
      # una vez al año (1.30 → 1.32) y se sube a mano
      - dependency-name: nginxinc/nginx-unprivileged
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
