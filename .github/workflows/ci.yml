name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint-backend:
    name: Lint backend (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Lint api/
        run: ruff check api/

  build-frontend:
    name: Build frontend (Vite)   # el nombre se mantiene: puede ser un check requerido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Tests con cobertura (mínimo 80 %)
        run: cd frontend && npm run test:cov

      # Bloquea vulnerabilidades altas de lo que llega al navegador; las de
      # herramientas de desarrollo se revisan con `npm audit` completo
      - name: Auditoría de dependencias de producción
        run: cd frontend && npm audit --omit=dev --audit-level=high

      - name: Build
        run: cd frontend && npm run build
